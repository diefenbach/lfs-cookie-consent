{% if event and gtm_id %}
{{ event|json_script:"added-to-cart-event" }}
<script>
  (function () {
    var el = document.getElementById('added-to-cart-event');
    if (!el) return;
    window.dataLayer = window.dataLayer || [];
    dataLayer.push(JSON.parse(el.textContent));
  })();
</script>
{% endif %}
